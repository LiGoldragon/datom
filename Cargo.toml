[package]
name        = "datom"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/LiGoldragon/datom"
description = "Datom text serialization and deserialization."
publish     = false

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "884f9334a658415053da277973df38549b82994a" }

[lib]
name = "datom"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
